<script>
let issues=JSON.parse(document.querySelector('#issues-data').textContent);let current=issues[0],section='trends',focus='',query='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>{try{return new URL(u).protocol==='https:'?u:'#'}catch{return'#'}};

const host=u=>{try{return new URL(u).hostname.replace('www.','')}catch{return''}};
function render(){const s=current.sections[section],all=s.items||[],items=all.filter(i=>(!focus||cats(i).includes(focus))&&(!query||[i.brand,i.title,i.overview,i.type,i.insight].join(' ').toLowerCase().includes(query.toLowerCase())));document.querySelector('#range').textContent=current.start.slice(5).replace('-','.')+' — '+current.end.slice(5).replace('-','.');document.querySelector('#section-title').textContent=section==='trends'?'设计趋势':'竞品追踪';document.querySelector('#section-copy').textContent=section==='trends'?'看看新的设计做法，寻找可借鉴的灵感。':'看看其他产品怎么做，发现体验上的新变化。';document.querySelector('#count').textContent=items.length+' 篇观察';document.querySelector('#summary').textContent=s.summary;document.querySelector('#footer').textContent='小度设计观察 / 设计趋势与竞品追踪 · 更新于 '+current.generated_at;document.querySelectorAll('.tab').forEach((b,n)=>{b.classList.toggle('active',b.dataset.section===section);b.querySelector('small').textContent=current.sections[b.dataset.section].items.length});document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.focus===focus));document.querySelector('#cards').innerHTML=items.length?items.map(i=>{const image=i.images?.[0];return '<article class="card"><a class="cover" href="'+esc(safe(i.url))+'" target="_blank" rel="noopener">'+(image?'<img src="'+esc(safe(image.url))+'" alt="'+esc(image.caption)+'" loading="lazy">':'')+'</a><div class="topline">'+cats(i).map(c=>'<span class="badge '+(c==='UX'?'ux':'')+'">'+c+' '+(c==='UX'?'使用体验':'界面视觉')+'</span>').join('')+'<time>'+esc(i.published)+'</time></div><h3><a href="'+esc(safe(i.url))+'" target="_blank" rel="noopener">'+esc(i.title||i.brand)+'</a></h3><p class="deck">'+esc(i.overview)+'</p><div class="foot"><span>'+esc(host(i.url))+'</span><span class="topic">'+esc(i.type)+'</span></div><details class="details"><summary>查看设计解读</summary><p>'+esc(i.overview)+'</p><p class="insight"><b>小度可以借鉴什么</b><br>'+esc(i.insight)+'</p><a class="source" href="'+esc(safe(i.url))+'" target="_blank" rel="noopener">阅读完整原文</a></details></article>'}).join(''):'<div class="empty">本期没有符合筛选条件的文章。只收录已核实内容，不用旧闻凑数。</div>';history.replaceState(null,'','?section='+section+(focus?'&focus='+focus:'')+(query?'&q='+encodeURIComponent(query):''));}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{section=b.dataset.section;focus='';render()});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{focus=b.dataset.focus;render()});document.querySelector('#search').oninput=e=>{query=e.target.value.trim();render()};const week=document.querySelector('#week');const fillWeeks=()=>{week.innerHTML='';issues.forEach(i=>week.add(new Option(i.start+' — '+i.end,i.start)))};fillWeeks();week.onchange=()=>{current=issues.find(i=>i.start===week.value)||issues[0];render()};const p=new URLSearchParams(location.search);if(p.get('section')==='competitors')section='competitors';if(['UX','UI'].includes(p.get('focus')))focus=p.get('focus');query=p.get('q')||'';document.querySelector('#search').value=query;render();fetch('./issues.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(next=>{if(Array.isArray(next)&&next.length){issues=next.sort((a,b)=>b.start.localeCompare(a.start));current=issues[0];fillWeeks();render()}}).catch(()=>{});

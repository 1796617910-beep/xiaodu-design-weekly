色、尺寸适配等低创造性任务上。对设计团队来说，值得采用的工具不是让人无脑多产，而是释放时间给创意判断。 3、素材合规影响信任 Adobe Stock AI Studio 以授权素材和创作者补偿作为基础，回应了 AI 训练来源与商业安全问题。品牌和设计团队在使用 AIGC 时，应优先选择来源清楚、授权明确、可向客户解释的工具链。 4、从零生成不是唯一方向 文章强调从真实摄影、插画、视频和音乐素材出发，再用 AI 调整与再创作。这个路径更适合专业设计流程，因为它保留了高质量基础，也让创作者的判断能持续介入。","published":"2026-06-19","url":"#","event_key":"history-trends-2026-06-19-AI Studio-1","images":[{"url":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAwIiBoZWlnaHQ9IjY3NSIgdmlld0JveD0iMCAwIDEyMDAgNjc1IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IkFJIFN0dWRpb+S/oeaBr+WwgemdoiI+CjxzdHlsZT4KdGV4dHtmb250LWZhbWlseTotYXBwbGUtc3lzdGVtLEJsaW5rTWFjU3lzdGVtRm9udCwiUGluZ0ZhbmcgU0MiLCJNaWNyb3NvZnQgWWFIZWkiLEFyaWFsLHNhbnMtc2VyaWZ9IC5leWVicm93e2ZvbnQtc2l6ZToyNHB4O2ZvbnQtd2VpZ2h0OjcwMDtsZXR0ZXItc3BhY2luZzozcHg7ZmlsbDojOEVDOUZGfS5icmFuZHtmb250LXNpemU6NTZweDtmb250LXdlaWdodDo3NjA7ZmlsbDojRURGN0ZGfS50aXRsZXtmb250LXNpemU6NDRweDtmb250LXdlaWdodDo2NTA7ZmlsbDojZmZmfS5tZXRhe2ZvbnQtc2l6ZToyNHB4O2ZvbnQtd2VpZ2h0OjYwMDtmaWxsOiNFREY3RkZ9Cjwvc3R5bGU+CjxyZWN0IHdpZHRoPSIxMjAwIiBoZWlnaHQ9IjY3NSIgcng9IjMyIiBmaWxsPSIjMTczMTUzIi8+CjxjaXJjbGUgY3g9IjEwODAiIGN5PSIxMTIiIHI9IjIxMCIgZmlsbD0iIzhFQzlGRiIgb3BhY2l0eT0iLjE0Ii8+PGNpcmNsZSBjeD0iMTEwMCIgY3k9IjU4MCIgcj0iMzIwIiBmaWxsPSIjOEVDOUZGIiBvcGFjaXR5PSIuMDgiLz4KPHBhdGggZD0iTTk0MCAxMTZoMTEydjExMkg5NDB6TTEwMjYgMjAyaDExMnYxMTJoLTExMnoiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzhFQzlGRiIgc3Ryb2tlLXdpZHRoPSIxMCIgb3BhY2l0eT0iLjc1Ii8+Cjx0ZXh0IHg9IjcyIiB5PSI4MiIgY2xhc3M9ImV5ZWJyb3ciPkRFU0lHTiBUUkVORDwvdGV4dD4KPHRleHQgeD0iNzIiIHk9IjE3OCIgY2xhc3M9ImJyYW5kIj5BSSBTdHVkaW88L3RleHQ+Cjx0ZXh0IHg9IjcyIiB5PSIyNjAiIGNsYXNzPSJ0aXRsZSI+6L+Z56+H5paH56ug6K6o6K665LqGIEFJIOi/m+WFpeWIm+aEj+W3peS9nOWQjueahOS4gDwvdGV4dD48dGV4dCB4PSI3MiIgeT0iMzMyIiBjbGFzcz0idGl0bGUiPuS4quWFs+mUrui9rOWPmO+8muW9k+WGheWuueeUn+S6p+WPmOW+l+i2iuadpei2iuW/q+OAgei2iuadpTwvdGV4dD48dGV4dCB4PSI3MiIgeT0iNDA0IiBjbGFzcz0idGl0bGUiPui2iuS+v+WunO+8jOecn+ato+eogOe8uueahOiDveWKm+S4jeWGjeaYr+KAnOWBmuWHuuS4nOilv+KAneKApjwvdGV4dD4KPHJlY3QgeD0iNzIiIHk9IjU2O 026-06-09","url":"https://techcrunch.com/2026/06/09/wwdc-2026-everything-announced-on-siri-ai-os-27-apple-intelligence-and-more/","event_key":"history-trends-2026-06-09-苹果-0","images":[{"url":"https://images.weserv.nl/?url=https%3A%2F%2Ftechcrunch.com%2Fwp-content%2Fuploads%2F2026%2F06%2Fapple-siri-ai-use-cases.png%3Fw%3D1186&w=1200&h=675&fit=cover&output=webp","caption":"苹果文章主视觉；图片来源原文","source":"https://techcrunch.com/2026/06/09/wwdc-2026-everything-announced-on-siri-ai-os-27-apple-intelligence-and-more/","original_url":"https://techcrunch.com/wp-content/uploads/2026/06/apple-siri-ai-use-cases.png?w=1186","kind":"original-local"}]},{"brand":"Newspaper Club","title":"NewspaperClub × abcD8：当一个字体成为真正属于你的资产","overview":"NewspaperClub × abcD8：当一个字体成为真正属于你的资产","type":"字体设计","focus":"UX","insight":"任何有经验的设计师都知道，字体可以贵到令人咋舌，授权协议更是一片雷区：按用户数收费、按触点收费、按年续费……当一款标题字体成为品牌视觉识别的核心骨架时，不断攀升的授权费终将变成一个没有尽头的账单。 这正是 Newspaper Club CEO Anne Ward 的处境。十余年来，她与格拉斯哥创意机构 D8 保持着深度合作，眼看着标题字体的授权成本一年比一年高。在某个时间节点，她得出了一个简单的结论：“买断它，比继续交费更划算。” 于是 Anne 找到了 D8，提出了一个新的想法：为 Newspaper Club 创作一款专属字体，永久买断，从此不再受制于任何第三方铸造厂。这个项目，也成为了 D8 旗下全新字体铸造厂 abcD8 的第一单业务。 1、可变字体是标题排版的自由度神器 传统字体在字宽上通常只有有限的几档选择（Light / Regular / Bold /Condensed）。可变字体打破了这一限制，设计师可以在连续的参数轴上精细控制字形，尤其适合需要频繁适配不同媒介和版式的品牌标题系统。 2、历史档案馆是字体设计的宝藏研究库 St Bride Foundation 的档案启发了 NCHEADLINE 最关键的技术决策（可变字宽）。设计研究不必只在数字屏幕前进行——那些尘封的印刷史料，往往藏有无法从 Google 搜索到的第一手灵感。 3、「全大写」是一个产品决策，不是限制 NC HEADLINE 故意不设计小写字母，将字体功能锁定在「标题」这一单一场景。产品专注度有时比全能更有力量——一个为特定用途极度优化的工具，往往比泛用型工具更令人记忆深刻。","published":"2026-06-10","url":"https://www.creativeboom.com/news/newspaper-club-teams-up-with-abcd8-on-nc-headline-a-tabloid-inspired-typeface-it-owns-outright/","event_key":"history-trends-2026-06-10-Newspaper Club-1","images":[{"url":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAwIiBoZWlnaHQ9IjY3NSIgdmlld0JveD0iMCAwIDEyMDAgNjc1IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9Ik5ld3NwYXBlciBDbHVi5L+h5oGv5bCB6Z2iIj4KPHN0eWxlPgp0ZXh0e2ZvbnQtZmFtaWx5Oi1hcHBsZS1zeXN0ZW 的填表式操作，回归以人类本能语言为核心的交互方式，实现意图的直觉表达。 2.“模糊输入”与“精准预测” 具体说明：系统不再苛求精确指令，而是通过理解口语化描述并结合情境，精准预判并补全用户的真实需求。 3.从“被动响应”转向“主动生成” 具体说明：界面不再是死板的预设，而是由 AI 根据任务实时生成即时 UI，从等待指令进化为主动引导决策。 2025年12月0","published":"2026-01-08","url":"https://blog.bigbigwork.com/archives/202601084","event_key":"history-trends-2026-01-08-微软-0","images":[{"url":"https://images.weserv.nl/?url=https%3A%2F%2Fblog.bigbigwork.com%2Fupload%2F2020%2F12%2Fblogbackground-278fa13cdbe043acbc9b1382132caa9d.jpg&w=1200&h=675&fit=cover&output=webp","caption":"微软文章主视觉；图片来源原文","source":"https://blog.bigbigwork.com/archives/202601084","original_url":"https://blog.bigbigwork.com/upload/2020/12/blogbackground-278fa13cdbe043acbc9b1382132caa9d.jpg","kind":"original-local"}]},{"brand":"总结：","title":"交互趋势： 从“我说它做”的主动指令，转向 “它懂我需” 的主动感知","overview":"交互趋势： 从“我说它做”的主动指令，转向 “它懂我需” 的主动感知","type":"硬件趋势：从“电器”到“家俱”","focus":"UI","insight":"形态趋势： 从“盒子”到“生命” UI趋势： 视觉“人格化”，轻质感和极简的融合，情绪价值与极致细节 结语： 未来的智能产品趋势是在一个“隐形”的环境里、但在你需要时又具备强烈“生命感”的存在。对于小度的未来，设计不再是“画图标”，而是 “造生命” 谷歌 隆重推出 Stitch 的“氛围设计” UI 1.从“像素设计”转向“氛围设计 具体说明：Stitch 的核心理念是 \"Vibe Design\"。它标志着 UI 设计正在从手动摆放组件，转向通过自然语言、情绪描述和意图来驱动界面生成的阶段 2.空间感 UI (Spatial UI) 与 “流体玻璃 (Liquid Glass)” 具体说明：Glassmorphism 2.0（玻璃拟态 2.0）。这被称为 \"Liquid Glass\"（流体玻璃），它不仅是半透明，还能折射环境光线并产生动态深度感。","published":"2026-03-26","url":"https://blog.google/innovation-and-ai/models-and-research/google-labs/stitch-ai-ui-design/","event_key":"history-trends-2026-03-26-总结：-1","images":[{"url":"https://images.weserv.nl/?url=https%3A%2F%2Fstorage.googleapis.com%2Fgweb-uniblog-publish-prod%2Fimages%2FStitch_Keyword_Hero_Visual.width-1300.png&w=1200&h=675&fit=cover&output=webp","caption":"总结：文章主视觉；图片来源原文","source":"https://blog.google/innovation-and-ai/models-and-research/google-labs/stitch-ai-ui-design/","original_url":"https://storage.googleapis.com/gweb-uniblog-publish-prod/images/Stitch_Keyword_Hero_Visual.width-1300.png","kind":"original-local"}]},{"brand":"Miquido","title":"2026 年十大 UI/UX 设计趋势及精彩案例","overview":"2026 年十大 UI/UX 设

const matches=(i,meta,q)=>q.toLowerCase().split(/\s+/).filter(Boolean).every(term=>{const group=aliases.find(a=>a.includes(term));const words=group||[term];const hay=searchText(i,meta);return words.some(w=>hay.includes(w))});
const allEntries=()=>issues.flatMap(issue=>['trends','competitors'].flatMap(key=>(issue.sections[key]?.items||[]).map(item=>({item,meta:{start:issue.start,end:issue.end,generated_at:issue.generated_at,section:key,sectionLabel:key==='trends'?'设计趋势':'竞品追踪'}}))));
const fallbackCover=(i,meta)=>{const palettes=[['#ede9e2','#4e483e'],['#e6ecea','#354d47'],['#e9eaf1','#454965'],['#f1e6df','#76503e'],['#e5ebf0','#3e5669']];const seed=Array.from(i.brand||'').reduce((n,c)=>n+c.charCodeAt(0),0);const [bg,ink]=palettes[seed%palettes.length];const brand=(i.brand||'设计灵感').length>24?'设计灵感':i.brand;return '<span class="editorial-cover" style="--cover-bg:'+bg+';--cover-ink:'+ink+'" role="img" aria-label="'+esc(brand)+'封面"><span class="cover-kicker">'+(meta.section==='trends'?'DESIGN INSPIRATION':'PRODUCT WATCH')+'</span><span class="cover-brand">'+esc(brand)+'</span><span class="cover-bottom">'+esc(contentType(i)||'DESIGN')+'</span></span>'};
const insightMarkup=i=>{if(!i.insight_headline||!i.insight_detail)return esc(i.insight);const detail=i.insight_detail,key=i.insight_emphasis,at=key?detail.indexOf(key):-1;const body=at<0?esc(detail):esc(detail.slice(0,at))+'<strong class="insight-emphasis">'+esc(key)+'</strong>'+esc(detail.slice(at+key.length));return '<strong class="insight-headline">'+esc(i.insight_headline)+'</strong>'+body;};
const card=(i,meta,index)=>{const image=i.images?.find(x=>x.kind==='article-body')||i.images?.find(x=>x.kind!=='editorial-fallback');const url=safe(i.url),fallback=fallbackCover(i,meta),media=image?safeMedia(image.url):'';const priority=index===0?' loading="eager" fetchpriority="high"':' loading="lazy"';const visual=media?'<img src="'+esc(media)+'" alt="'+esc(image.caption)+'"'+priority+' decoding="async">':fallback;const cover=url?'<a class="cover" data-fallback="'+esc(fallback)+'" href="'+esc(url)+'" target="_blank" rel="noopener">'+visual+'</a>':'<button class="cover" type="button" data-missing-source aria-label="查看'+esc(i.brand)+'已保存摘要" title="原文链接暂缺，点击查看已保存摘要">'+visual+'</button>';return '<article class="card">'+cover+'<div class="topline">'+(query?'<span class="badge section">'+meta.sectionLabel+'</span>':'')+'<span class="badge '+(cats(i).includes('UX')?'ux':'')+'">'+esc(contentType(i))+'</span><time>'+esc(i.published)+'</time></div><h3>'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(i.brand)+'</a>':esc(i.brand))+'</h3><p class="article-title">'+esc(i.title||i.overview)+'</p><p class="attention"><b>设计关注点</b>'+insightMarkup(i)+'</p><div class="foot"><span>'+esc(i.source_label||host(url))+'</span><span class="topic">'+esc(contentType(i))+'</span></div><details class="details"><summary>查看文章摘要</summary><p>'+esc(i.overview)+'</p>'+(url?'<a class="source" href="'+esc(url)+'" target="_blank" rel="noopener">阅读完整原文</a>':'<p class="missing-source">这条历史记录未提供有效原文链接，可阅读以上已保存摘要。</p>')+'</details></article>'};
document.querySelector('#cards').addEventListener('click',e=>{const button=e.target.closest('[data-missing-source]');if(button){const details=button.closest('.card').querySelector('details');details.open=true;details.scrollIntoView({behavior:'smooth',block:'nearest'});}});
document.querySelector('#cards').addEventListener('error',e=>{if(e.target.tagName==='IMG'){const cover=e.target.closest('.cover');if(cover?.dataset.fallback)cover.innerHTML=cover.dataset.fallback;}},true);
let layoutFrame=0,layoutWidth=0;
function queueCardLayout(){if(!layoutFrame)layoutFrame=requestAnimationFrame(()=>{layoutFrame=0;arrangeCards()})}
const cardSizes=new ResizeObserver(entries=>{if(entries.some(entry=>entry.target.id!=='cards'||Math.abs(entry.contentRect.width-layoutWidth)>1))queueCardLayout()});
function arrangeCards(){
  const container=document.querySelector('#cards'),cards=Array.from(container.querySelectorAll('.card'));
  const style=getComputedStyle(container),widths=style.gridTemplateColumns.split(' ').map(parseFloat),gap=parseFloat(style.columnGap)||24;
  layoutWidth=container.clientWidth;
  if(!cards.length){container.style.height='';return}
  const count=Math.max(1,widths.length),tops=Array(count).fill(24);
  cards.forEach((card,index)=>{const column=index%count;card.style.width=widths[column]+'px';card.style.left=(widths.slice(0,column).reduce((sum,width)=>sum+width,0)+column*gap)+'px';card.style.top=tops[column]+'px';tops[column]+=Math.ceil(card.getBoundingClientRect().height)+24});
  container.style.height=(Math.max(...tops)+16)+'px';
}
function observeCards(){cardSizes.disconnect();arrangeCards();cardSizes.observe(document.querySelector('#cards'));document.querySelectorAll('.card').forEach(card=>cardSizes.observe(card))}
window.addEventListener('resize',queueCardLayout);
function render(push=false){const s=current.sections[section],global=Boolean(query),entries=global?allEntries().filter(({item,meta})=>(!focus||cats(item).includes(focus))&&matches(item,meta,query)):(s.items||[]).filter(i=>!focus||cats(i).includes(focus)).map(item=>({item,meta:{start:current.start,end:current.end,section,sectionLabel:section==='trends'?'设计趋势':'竞品追踪'}}));document.querySelector('#issue-number').textContent=global?'全部期刊':'第 '+(issueIndex.length-issueIndex.findIndex(i=>i.start===current.start))+' 期'+(current.test_mode?' · 测试':'');document.querySelector('#test-banner').hidden=!current.test_mode;document.querySelector('#test-banner').textContent=current.test_mode?(current.test_note||'测试期号；本期文章均为真实检索与核验内容。'):'';document.querySelector('#range').textContent=global?'全部往期':(current.display_start||current.start).slice(5).replace('-','.')+' — '+(current.display_end||current.end).slice(5).replace('-','.');document.querySelector('#section-title').textContent=global?'全站搜索结果':section==='trends'?'设计趋势':'竞品追踪';document.querySelector('#section-copy').textContent=global?'正在搜索全部历史周刊的两个板块。':section==='trends'?'让设计贯穿小度的每一种产品，让智能融入生活的每一个细节。':'看见同行的新一步，找到小度体验的下一步。';document.querySelector('#count').textContent=entries.length+' 篇文章';document.querySelector('#summary').textContent=global?'“'+query+'”的匹配结果。':s.summary;document.querySelector('#footer').textContent='小度用户体验部 / 设计周刊 · 最新数据更新于 '+issues[0].generated_at;document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',!global&&b.dataset.section===section);b.querySelector('small').textContent=current.sections[b.dataset.section].items.length});document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.focus===focus));document.querySelector('#week').disabled=global;document.querySelector('#cards').innerHTML=entries.length?entries.map(({item,meta},index)=>card(item,meta,index)).join(''):'<div class="empty">'+(global?'没有找到匹配的历史文章。试试品牌、产品、硬件类型或 UI / UX 关键词。':'本期未收录'+(section==='trends'?'设计趋势':'竞品追踪')+'文章，可切换其他期刊查看。')+'</div>';observeCards();document.querySelector('#week').value=current.start;const stateUrl='?section='+section+'&week='+current.start+(query?'&q='+encodeURIComponent(query):'');if(push)history.pushState(null,'',stateUrl);else history.replaceState(null,'',stateUrl);}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{query='';document.querySelector('#search').value='';section=b.dataset.section;focus='';render(true)});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{focus=b.dataset.focus;render()});document.querySelector('#search').oninput=async e=>{query=e.target.value.trim();if(query&&!archiveLoaded){document.querySelector('#cards').innerHTML='<div class="empty">正在加载历史文章…</div>';try{await ensureArchive()}catch{document.querySelector('#cards').innerHTML='<div class="empty">历史文章暂时无法加载，请稍后重试。</div>';return}}render()};const week=document.querySelector('#week');function fillWeeks(){week.innerHTML='';issueIndex.forEach((i,idx)=>{const opt=new Option('第 '+(issueIndex.length-idx)+' 期'+(i.test_mode?'（测试）':''),i.start);opt.title=(i.display_start||i.start)+' — '+(i.display_end||i.end);week.add(opt)})}fillWeeks();async function selectWeek(start,push=true){if(!issues.some(i=>i.start===start))document.querySelector('#cards').innerHTML='<div class="empty">正在加载所选期刊…</div>';try{current=await ensureIssue(start)}catch{document.querySelector('#cards').innerHTML='<div class="empty">往期文章暂时无法加载，请稍后重试。</div>';return}render(push)}week.onchange=()=>selectWeek(week.value,true);async function restoreState(){const p=new URLSearchParams(location.search),targetWeek=p.get('week');section=p.get('section')==='competitors'?'competitors':'trends';focus='';query=p.get('q')||'';document.querySelector('#search').value=query;try{if(query)await ensureArchive();else if(targetWeek&&targetWeek!==issues[0].start)await ensureIssue(targetWeek)}catch{}current=issues.find(i=>i.start===targetWeek)||issues[0];render();}window.addEventListener('popstate',restoreState);restoreState();
</script></body></html>

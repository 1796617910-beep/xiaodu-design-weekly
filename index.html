let layoutFrame=0,layoutWidth=0;
function queueCardLayout(){if(!layoutFrame)layoutFrame=requestAnimationFrame(()=>{layoutFrame=0;arrangeCards()})}
const cardSizes=new ResizeObserver(entries=>{if(entries.some(entry=>entry.target.id!=='cards'||Math.abs(entry.contentRect.width-layoutWidth)>1))queueCardLayout()});
function arrangeCards(){
  const container=document.querySelector('#cards'),cards=Array.from(container.querySelectorAll('.card'));
  const style=getComputedStyle(container),widths=style.gridTemplateColumns.split(' ').map(parseFloat),gap=parseFloat(style.columnGap)||24;
  layoutWidth=container.clientWidth;
  if(!cards.length){container.style.height='';return}
  const count=Math.max(1,widths.length),tops=Array(count).fill(24);
  cards.forEach((card,index)=>{card.style.width=widths[index%count]+'px';card.querySelectorAll('h3,.article-title,.attention,.foot').forEach(part=>part.style.minHeight='')});
  // Align closed-card sections within each row; expanded summaries only move their own column.
  if(count>1)for(let start=0;start<cards.length;start+=count){const row=cards.slice(start,start+count);for(const selector of ['h3','.article-title','.attention','.foot']){const parts=row.map(card=>card.querySelector(selector)),height=Math.ceil(Math.max(...parts.map(part=>part.getBoundingClientRect().height)));parts.forEach(part=>part.style.minHeight=height+'px')}}
  cards.forEach((card,index)=>{const column=index%count;card.style.left=(widths.slice(0,column).reduce((sum,width)=>sum+width,0)+column*gap)+'px';card.style.top=tops[column]+'px';tops[column]+=Math.ceil(card.getBoundingClientRect().height)+24});
  container.style.height=(Math.max(...tops)+16)+'px';
}
function observeCards(){cardSizes.disconnect();arrangeCards();cardSizes.observe(document.querySelector('#cards'));document.querySelectorAll('.card').forEach(card=>cardSizes.observe(card))}
window.addEventListener('resize',queueCardLayout);
function render(push=false){const s=current.sections[section],global=Boolean(query||activeTag),tag=DESIGN_TAGS.find(t=>t.id===activeTag),matched=global?allEntries().filter(({item,meta})=>(!activeTag||activeTag==='all'||articleTags(item).includes(activeTag))&&(!focus||cats(item).includes(focus))&&(!query||matches(item,meta,query))):(s.items||[]).filter(i=>!focus||cats(i).includes(focus)).map(item=>({item,meta:{start:current.start,end:current.end,section,sectionLabel:section==='trends'?'设计趋势':'竞品追踪'}})),entries=global&&sectionScope?matched.filter(entry=>entry.meta.section===sectionScope):matched;document.querySelector('#issue-number').textContent=global?'全部期刊':'第 '+(issueIndex.length-issueIndex.findIndex(i=>i.start===current.start))+' 期'+(current.test_mode?' · 测试':'');document.querySelector('#test-banner').hidden=!current.test_mode;document.querySelector('#test-banner').textContent=current.test_mode?(current.test_note||'测试期号；本期文章均为真实检索与核验内容。'):'';document.querySelector('#range').textContent=global?'全部往期':(current.display_start||current.start).slice(5).replace('-','.')+' — '+(current.display_end||current.end).slice(5).replace('-','.');document.querySelector('#section-title').textContent=global?(query?'全站搜索结果':tag?.label||'全部文章'):section==='trends'?'设计趋势':'竞品追踪';document.querySelector('#section-copy').textContent=global?'覆盖全部往期的设计趋势与竞品追踪，可叠加关键词搜索。':section==='trends'?'让设计贯穿小度的每一种产品，让智能融入生活的每一个细节。':'看见同行的新一步，找到小度体验的下一步。';document.querySelector('#count').textContent=entries.length+' 篇文章';document.querySelector('#summary-label').textContent=global?'筛选范围':'本期看点';document.querySelector('#summary').textContent=global?['全部 '+issueIndex.length+' 期',tag?.label,query?'关键词：'+query:'',sectionScope?(sectionScope==='trends'?'设计趋势':'竞品追踪'):''].filter(Boolean).join(' · '):s.summary;document.querySelector('#back-to-issue').hidden=!global;document.querySelector('#back-to-issue').textContent='返回第 '+(issueIndex.length-issueIndex.findIndex(i=>i.start===current.start))+' 期';document.querySelectorAll('[data-design-tag]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.designTag===activeTag)));document.querySelector('#footer').textContent='小度用户体验部 / 设计周刊 · 最新数据更新于 '+issues[0].generated_at;document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.section===(global?sectionScope:section));b.querySelector('small').textContent=global?matched.filter(entry=>entry.meta.section===b.dataset.section).length:current.sections[b.dataset.section].items.length});document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.focus===focus));document.querySelector('#week').disabled=global;document.querySelector('#cards').innerHTML=entries.length?entries.map(({item,meta},index)=>card(item,meta,index)).join(''):'<div class="empty">'+(global?'没有找到匹配的历史文章。试试品牌、产品、硬件类型或 UI / UX 关键词。':'本期未收录'+(section==='trends'?'设计趋势':'竞品追踪')+'文章，可切换其他期刊查看。')+'</div>';observeCards();document.querySelector('#week').value=current.start;const stateUrl='?section='+section+'&week='+current.start+(query?'&q='+encodeURIComponent(query):'')+(activeTag?'&tag='+encodeURIComponent(activeTag):'')+(global&&sectionScope?'&scope='+sectionScope:'');if(push)history.pushState(null,'',stateUrl);else history.replaceState(null,'',stateUrl);}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{section=b.dataset.section;if(query||activeTag)sectionScope=section;else sectionScope='';focus='';render(true)});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{focus=b.dataset.focus;render()});document.querySelector('#search').oninput=async e=>{query=e.target.value.trim();if(query&&!archiveLoaded){document.querySelector('#cards').innerHTML='<div class="empty">正在加载历史文章…</div>';try{await ensureArchive()}catch{document.querySelector('#cards').innerHTML='<div class="empty">历史文章暂时无法加载，请稍后重试。</div>';return}}render()};const week=document.querySelector('#week');function fillWeeks(){week.innerHTML='';issueIndex.forEach((i,idx)=>{const opt=new Option('第 '+(issueIndex.length-idx)+' 期'+(i.test_mode?'（测试）':''),i.start);opt.title=(i.display_start||i.start)+' — '+(i.display_end||i.end);week.add(opt)})}fillWeeks();async function selectWeek(start,push=true){if(!issues.some(i=>i.start===start))document.querySelector('#cards').innerHTML='<div class="empty">正在加载所选期刊…</div>';query='';activeTag='';sectionScope='';document.querySelector('#search').value='';try{current=await ensureIssue(start)}catch{document.querySelector('#cards').innerHTML='<div class="empty">往期文章暂时无法加载，请稍后重试。</div>';return}render(push)}week.onchange=()=>selectWeek(week.value,true);async function restoreState(){const p=new URLSearchParams(location.search),targetWeek=p.get('week');section=p.get('section')==='competitors'?'competitors':'trends';focus='';query=p.get('q')||'';activeTag=DESIGN_TAGS.some(t=>t.id===p.get('tag'))?p.get('tag'):'';sectionScope=['trends','competitors'].includes(p.get('scope'))?p.get('scope'):'';document.querySelector('#search').value=query;try{if(query||activeTag)await ensureArchive();if(targetWeek&&targetWeek!==issues[0].start)await ensureIssue(targetWeek)}catch{}current=issues.find(i=>i.start===targetWeek)||issues[0];render();}document.querySelectorAll('[data-design-tag]').forEach(button=>button.onclick=async()=>{activeTag document.querySelector('#back-to-issue').onclick=()=>{query='';activeTag='';sectionScope='';focus='';document.querySelector('#search').value='';render(true)};

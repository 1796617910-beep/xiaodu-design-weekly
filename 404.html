<script>
let issues=JSON.parse(document.querySelector('#issues-data').textContent);let current=issues[0],section='trends',focus='',query='';

const safe=u=>{try{return new URL(u).protocol==='https:'?u:'#'}catch{return'#'}};

k" rel="noopener">阅读完整原文</a></details></article>'}).join(''):'<div class="empty">本期没有符合筛选条件的文章。只收录已核实内容，不用旧闻凑数。</div>';history.replaceState(null,'','?section='+section+(focus?'&focus='+focus:'')+(query?'&q='+encodeURIComponent(query):''));}

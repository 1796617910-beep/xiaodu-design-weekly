function render(push=false){const s=current.sections[section],global=Boolean(query),entries=global?allEntries().filter(({item,meta})=>(!focus||cats(item).includes(focus))&&matches(item,meta,query)):(s.items||[]).filter(i=>!focus||cats(i).includes(focus)).map(item=>({item,meta:{start:current.start,end:current.end,section,sectionLabel:section==='trends'?'设计趋势':'竞品追踪'}}));document.querySelector('#issue-number').textContent=global?'全部期刊':'第 '+(issueIndex.length-issueIndex.findIndex(i=>i.start===current.start))+' 期'+(current.test_mode?' · 测试':'');document.querySelector('#test-banner').hidden=!current.test_mode;document.querySelector('#test-banner').textContent=current.test_mode?(current.test_note||'测试期号；本期文章均为真实检索与核验内容。'):'';document.querySelector('#range').textContent=global?'全部往期':(current.display_start||current.start).slice(5).replace('-','.')+' — '+(current.display_end||current.end).slice(5).replace('-','.');document.querySelector('#section-title').textContent=global?'全站搜索结果':section==='trends'?'设计趋势':'竞品追踪';document.querySelector('#section-copy').textContent=global?'正在搜索全部历史周刊的两个板块。':section==='trends'?'让设计贯穿小度的每一种产品，让智能融入生活的每一个细节。':'看见同行的新一步，找到小度体验的下一步。';document.querySelector('#count').textContent=entries.length+' 篇文章';document.querySelector('#summary').textContent=global?'“'+query+'”的匹配结果。':s.summary;document.querySelector('#footer').textContent='小度用户体验部 / 设计周刊 · 最新数据更新于 '+issues[0].generated_at;document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',!global&&b.dataset.section===section);b.querySelector('small').textContent=current.sections[b.dataset.section].items.length});document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.focus===focus));document.querySelector('#week').disabled=global;document.querySelector('#cards').innerHTML=entries.length?entries.map(({item,meta},index)=>card(item,meta,index)).join(''):'<div class="empty">'+(global?'没有找到匹配的历史文章。试试品牌、产品、硬件类型或 UI / UX 关键词。':'本期未收录'+(section==='trends'?'设计趋势':'竞品追踪')+'文章，可切换其他期刊查看。')+'</div>';observeCards();document.querySelector('#week').value=current.start;const stateUrl='?section='+section+'&week='+current.start+(query?'&q='+encodeURIComponent(query):'');if(push)history.pushState(null,'',stateUrl);else history.replaceState(null,'',stateUrl);}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{query='';document.querySelector('#search').value='';section=b.dataset.section;focus='';render(true)});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{focus=b.dataset.focus;render()});document.querySelector('#search').oninput=async e=>{query=e.target.value.trim();if(query&&!archiveLoaded){document.querySelector('#cards').innerHTML='<div class="empty">正在加载历史文章…</div>';try{await ensureArchive()}catch{document.querySelector('#cards').innerHTML='<div class="empty">历史文章暂时无法加载，请稍后重试。</div>';return}}render()};const week=document.querySelector('#week');function fillWeeks(){week.innerHTML='';issueIndex.forEach((i,idx)=>{const opt=new Option('第 '+(issueIndex.length-idx)+' 期'+(i.test_mode?'（测试）':''),i.start);opt.title=(i.display_start||i.start)+' — '+(i.display_end||i.end);week.add(opt)})}fillWeeks();async function selectWeek(start,push=true){if(!issues.some(i=>i.start===start)){try{await ensureArchive()}catch{document.querySelector('#cards').innerHTML='<div class="empty">往期文章暂时无法加载，请稍后重试。</div>';return}}current=issues.find(i=>i.start===start)||issues[0];render(push)}week.onchange=()=>selectWeek(week.value,true);async function restoreState(){const p=new URLSearchParams(location.search),targetWeek=p.get('week');section=p.get('section')==='competitors'?'competitors':'trends';focus='';query=p.get('q')||'';document.querySelector('#search').value=query;if((targetWeek&&targetWeek!==issues[0].start)||query){try{await ensureArchive()}catch{}}current=issues.find(i=>i.start===targetWeek)||issues[0];render();}window.addEventListener('popstate',restoreState);restoreState();
</script></body></html>

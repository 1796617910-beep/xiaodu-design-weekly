<script>
let issues=JSON.parse(document.querySelector('#issues-data').textContent);let current=issues[0],section='trends',focus='',query='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const contentType=i=>{if(i.display_type)return i.display_type;const text=[i.brand,i.title,i.overview].join(' ');if(/字体|字标|typeface|typograph/i.test(text))return '品牌 / 字体';if(/品牌|视觉识别|identity|rebrand|logo/i.test(text))return '品牌 / 视觉';if(/智能屏|智慧屏|中控屏|带屏|电视|TV|Nest Hub|Echo Show/i.test(text))return '智能屏 / 硬件';if(/眼镜|穿戴|wearable/i.test(text))return '穿戴设备 / 硬件';if(/平板|tablet|AINOTE|墨水屏/i.test(text))return '平板设备 / 硬件';if(/手机|iPhone|Galaxy S[0-9]/i.test(text))return '手机 / 硬件';if(/音箱|speaker|HomePod/i.test(text))return '智能音箱 / 硬件';if(/家居|IoT|Matter|SmartThings|家电/i.test(text))return /应用|界面|UI |UX |redesign/i.test(text)?'UI / 智能家居':'IoT / 智能家居';if(/浏览器|Firefox|browser/i.test(text))return 'UI / 浏览器';if(/动效|动画|motion/i.test(text))return 'UI / 动效';if(/交互|体验|助手|Agent|智能体|流程/i.test(text))return 'UX / 交互体验';if(/界面|UI|设计系统|design system/i.test(text))return 'UI / 界面设计';if(/家具|工业设计/i.test(text))return '产品 / 工业设计';return (i.type||'设计案例').length<32?i.type:'设计案例'};
const cats=i=>{const type=contentType(i);return /^UX/.test(type)?['UX']:/^UI/.test(type)?['UI']:[]};

const aliases=[['iot','物联网','智能家居','全屋智能'],['智能屏','智慧屏','带屏音箱','家庭大屏'],['ai','人工智能','大模型','agent','智能体'],['ui','界面','视觉','图标','色彩','字体','动效'],['ux','体验','交互','流程','反馈','易用性'],['音箱','语音助手','语音交互','远场语音'],['家具','家居','工业设计','硬件','家庭设备']];

const matches=(i,meta,q)=>q.toLowerCase().split(/\s+/).filter(Boolean).every(term=>{const group=aliases.find(a=>a.includes(term));const words=group||[term];const hay=searchText(i,meta);return words.some(w=>hay.includes(w))});

const fallbackCover=(i,meta)=>{const palettes=[['#ede9e2','#4e483e'],['#e6ecea','#354d47'],['#e9eaf1','#454965'],['#f1e6df','#76503e'],['#e5ebf0','#3e5669']];const seed=Array.from(i.brand||'').reduce((n,c)=>n+c.charCodeAt(0),0);const [bg,ink]=palettes[seed%palettes.length];const brand=(i.brand||'设计灵感').length>24?'设计灵感':i.brand;return '<span class="editorial-cover" style="--cover-bg:'+bg+';--cover-ink:'+ink+'" role="img" aria-label="'+esc(brand)+'编辑备用封面"><span class="cover-kicker">'+(meta.section==='trends'?'DESIGN INSPIRATION':'PRODUCT WATCH')+'</span><span class="cover-brand">'+esc(brand)+'</span><span class="cover-bottom">'+esc(contentType(i)||'DESIGN')+'</span></span>'};

const card=(i,meta)=>{const image=i.images?.find(x=>x.kind==='article-body')||i.images?.find(x=>x.kind!=='editorial-fallback');const url=safe(i.url),fallback=fallbackCover(i,meta),media=image?safeMedia(image.url):'';const visual=media?'<img src="'+esc(media)+'" alt="'+esc(image.caption)+'" loading="lazy" decoding="async">':fallback;const cover=url?'<a class="cover" data-fallback="'+esc(fallback)+'" href="'+esc(url)+'" target="_blank" rel="noopener">'+visual+'</a>':'<button class="cover" type="button" data-missing-source aria-label="查看'+esc(i.brand)+'已保存摘要" title="原文链接暂缺，点击查看已保存摘要">'+visual+'</button>';return '<article class="card">'+cover+'<div class="topline">'+(query?'<span class="badge section">'+meta.sectionLabel+'</span>':'')+'<span class="badge '+(cats(i).includes('UX')?'ux':'')+'">'+esc(contentType(i))+'</span><time>'+esc(i.published)+'</time></div><h3>'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(i.brand)+'</a>':esc(i.brand))+'</h3><p class="article-title">'+esc(i.title||i.overview)+'</p><p class="attention"><b>设计关注点</b>'+insightMarkup(i)+'</p><div class="foot"><span>'+esc(i.source_label||host(url))+'</span><span class="topic">'+esc(contentType(i))+'</span></div><details class="details"><summary>查看文章摘要</summary><p>'+esc(i.overview)+'</p>'+(url?'<a class="source" href="'+esc(url)+'" target="_blank" rel="noopener">阅读完整原文</a>':'<p class="missing-source">这条历史记录未提供有效原文链接，可阅读以上已保存摘要。</p>')+'</details></article>'};
document.querySelector('#cards').addEventListener('click',e=>{const button=e.target.closest('[data-missing-source]');if(button){const details=button.closest('.card').querySelector('details');details.open=true;details.scrollIntoView({behavior:'smooth',block:'nearest'});}});
document.querySelector('#cards').addEventListener('error',e=>{if(e.target.tagName==='IMG'){const cover=e.target.closest('.cover');if(cover?.dataset.fallback)cover.innerHTML=cover.dataset.fallback;}},true);
function render(push=false){const s=current.sections[section],global=Boolean(query),entries=global?allEntries().filter(({item,meta})=>(!focus||cats(item).includes(focus))&&matches(item,meta,query)):(s.items||[]).filter(i=>!focus||cats(i).includes(focus)).map(item=>({item,meta:{start:current.start,end:current.end,section,sectionLabel:section==='trends'?'设计趋势':'竞品追踪'}}));document.querySelector('#issue-number').textContent=global?'全部期刊':'第 '+(issues.length-issues.findIndex(i=>i.start===current.start))+' 期';document.querySelector('#range').textContent=global?'全部往期':(current.display_start||current.start).slice(5).replace('-','.')+' — '+(current.display_end||current.end).slice(5).replace('-','.');document.querySelector('#section-title').textContent=global?'全站搜索结果':section==='trends'?'设计趋势':'竞品追踪';document.querySelector('#section-copy').textContent=global?'正在搜索全部历史周刊的两个板块。':section==='trends'?'让设计贯穿小度的每一种产品，让智能融入生活的每一个细节。':'看见同行的新一步，找到小度体验的下一步。';document.querySelector('#count').textContent=entries.length+' 篇文章';document.querySelector('#summary').textContent=global?'“'+query+'”的匹配结果。':s.summary;document.querySelector('#footer').textContent='小度用户体验部 / 设计周刊 · 最新数据更新于 '+issues[0].generated_at;document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',!global&&b.dataset.section===section);b.querySelector('small').textContent=current.sections[b.dataset.section].items.length});document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.focus===focus));document.querySelector('#week').disabled=global;document.querySelector('#cards').innerHTML=entries.length?entries.map(({item,meta})=>card(item,meta)).join(''):'<div class="empty">没有找到匹配的历史文章。试试品牌、产品、硬件类型或 UI / UX 关键词。</div>';document.querySelector('#week').value=current.start;const stateUrl='?section='+section+'&week='+current.start+(query?'&q='+encodeURIComponent(query):'');if(push)history.pushState(null,'',stateUrl);else history.replaceState(null,'',stateUrl);}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{query='';document.querySelector('#search').value='';section=b.dataset.section;focus='';render(true)});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{focus=b.dataset.focus;render()});document.querySelector('#search').oninput=e=>{query=e.target.value.trim();render()};const week=document.querySelector('#week');const fillWeeks=()=>{week.innerHTML='';issues.forEach((i,idx)=>{const opt=new Option('第 '+(issues.length-idx)+' 期',i.start);opt.title=(i.display_start||i.start)+' — '+(i.display_end||i.end);week.add(opt)})};fillWeeks();week.onchange=()=>{current=issues.find(i=>i.start===week.value)||issues[0];render(true)};const restoreState=()=>{const p=new URLSearchParams(location.search);section=p.get('section')==='competitors'?'competitors':'trends';current=issues.find(i=>i.start===p.get('week'))||issues[0];focus='';query=p.get('q')||'';document.querySelector('#search').value=query;render();};window.addEventListener('popstate',restoreState);restoreState();
</script></body></html>

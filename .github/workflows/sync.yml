name: Sync weekly issues

on:
  schedule:
    - cron: '20 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node public-sync.mjs
      - name: Commit refreshed weekly data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html issues.json
          git diff --cached --quiet || git commit -m "Update weekly issue"
          git push
